name: Shortlinks

on:
  push:
    branches: [ main, master ]
  issues:
    types: [ opened, deleted, closed ]
  issue_comment:
    types: [ created ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  link-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Process Links
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          STATE_REASON: ${{ github.event.issue.state_reason }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          SENDER: ${{ github.event.sender.login }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // --- Configuration ---
            const DATA_FILE = 'data/links.json';
            const BANNED_FILE = 'data/banned.json';
            const REPO_FILE = 'data/repo.json';
            const DOMAIN_FILE = 'data/domain.json';
            const BRANCH = 'pages'; // Target branch for data
            const SLUG_RE = /^[A-Za-z0-9-_]+$/;

            const { owner, repo } = context.repo;

            // --- Helpers ---
            async function checkoutBranch() {
              try {
                await exec.exec('git', ['fetch', 'origin', BRANCH]);
                await exec.exec('git', ['checkout', BRANCH]);
              } catch (e) {
                console.log(`Branch ${BRANCH} not found, creating orphan branch.`);
                await exec.exec('git', ['checkout', '--orphan', BRANCH]);
                await exec.exec('git', ['rm', '-rf', '.']);
                // Copy initial data files from main if they don't exist in orphan
                await exec.exec('git', ['checkout', 'origin/main', '--', 'data', 'index.html', '404.html', 'CNAME']);
                await exec.exec('git', ['commit', '-m', 'Initial commit on pages branch']);
              }
            }

            function readJson(file) {
              if (!fs.existsSync(file)) return null;
              return JSON.parse(fs.readFileSync(file, 'utf8'));
            }

            function writeJson(file, data) {
              fs.mkdirSync(path.dirname(file), { recursive: true });
              fs.writeFileSync(file, JSON.stringify(data, null, 2));
            }

            function generateSlug() {
              const chars = 'abcdefghjkmnpqrstuvwxyz23456789'; // No easily confused chars
              let slug = '';
              for (let i = 0; i < 6; i++) {
                slug += chars.charAt(Math.floor(Math.random() * chars.length));
              }
              return slug;
            }

            // domain.json -> CNAME -> owner.github.io/repo (must be called after checkoutBranch)
            function getDomain() {
              try {
                const d = readJson(DOMAIN_FILE);
                if (d && d.domain) return d.domain;
              } catch (e) {}
              try {
                const cname = fs.readFileSync('CNAME', 'utf8').trim();
                if (cname) return cname;
              } catch (e) {}
              return `${owner}.github.io/${repo}`;
            }

            function shortUrlOf(slug) {
              return `https://${getDomain()}/${slug}`;
            }

            async function commitAndPush(message) {
              await exec.exec('git', ['add', DATA_FILE]);
              await exec.exec('git', ['commit', '-m', message]);
              for (let i = 0; i < 3; i++) {
                try {
                  await exec.exec('git', ['push', 'origin', BRANCH]);
                  return;
                } catch (e) {
                  await exec.exec('git', ['pull', '--rebase', 'origin', BRANCH]);
                }
              }
              throw new Error('Failed to push after retries');
            }

            // --- Main Logic ---

            // 1. Handle Push (Metadata Update)
            if (process.env.EVENT_NAME === 'push') {
              console.log('Handling Push event...');
              await checkoutBranch();

              const repoData = { repo: owner + '/' + repo };
              writeJson(REPO_FILE, repoData);

              if (fs.existsSync('CNAME')) {
                const cname = fs.readFileSync('CNAME', 'utf8').trim();
                const existing = readJson(DOMAIN_FILE);
                // Never overwrite a set domain with an empty CNAME
                if (cname || !(existing && existing.domain)) {
                  writeJson(DOMAIN_FILE, { domain: cname });
                }
              }

              await exec.exec('git', ['add', '.']);
              try {
                await exec.exec('git', ['commit', '-m', 'Update metadata from main']);
                await exec.exec('git', ['push', 'origin', BRANCH]);
              } catch (e) {
                console.log('Nothing to commit or push failed');
              }
              return;
            }

            // 2. Handle Issue/Comment
            const issueNumber = parseInt(process.env.ISSUE_NUMBER);
            if (!issueNumber) {
              console.log('No issue number, skipping.');
              return;
            }

            async function isAuthorized(username) {
              if (!username) return false;
              try {
                const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner, repo, username
                });
                return ['admin', 'write', 'maintain'].includes(permission.permission);
              } catch (e) {
                return false;
              }
            }

            async function comment(body) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
            }

            async function closeIssue(reason) {
              await github.rest.issues.update({
                owner, repo, issue_number: issueNumber,
                state: 'closed', state_reason: reason || 'completed'
              });
            }

            async function reopenIssue() {
              await github.rest.issues.update({ owner, repo, issue_number: issueNumber, state: 'open' });
            }

            // Parse Issue Body
            // Fields: URL:, SLUG:, DELETE:, EDIT:
            function parseBody(body) {
              let url = '', slug = '', del = '', edit = '';
              for (const raw of (body || '').split('\n')) {
                const line = raw.trim();
                const upper = line.toUpperCase();
                if (upper.startsWith('URL:')) url = line.slice(4).trim();
                else if (upper.startsWith('SLUG:')) slug = line.slice(5).trim();
                else if (upper.startsWith('DELETE:')) del = line.slice(7).trim();
                else if (upper.startsWith('EDIT:')) edit = line.slice(5).trim();
              }
              return { url, slug, del, edit };
            }

            // Load Data
            await checkoutBranch();
            let linksData = readJson(DATA_FILE) || { version: 1, links: [] };
            let bannedData = readJson(BANNED_FILE) || { version: 1, urls: [], hosts: [] };

            // Handle GitHub issue deletion -> remove matching link
            if (process.env.EVENT_NAME === 'issues' && process.env.ACTION === 'deleted') {
              const initialLength = linksData.links.length;
              linksData.links = linksData.links.filter(l => l.issueNumber !== issueNumber);
              if (linksData.links.length !== initialLength) {
                writeJson(DATA_FILE, linksData);
                await commitAndPush(`Delete link for issue #${issueNumber}`);
              }
              return;
            }

            // Get issue body (fetch when the event payload may be stale)
            let body = process.env.ISSUE_BODY;
            if (process.env.EVENT_NAME === 'issue_comment') {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              body = issue.body;
            }

            const { url, slug: requestedSlug, del: deleteSlug, edit: editSlug } = parseBody(body || '');

            // Request type
            const type = deleteSlug ? 'delete'
              : editSlug ? 'edit'
              : requestedSlug ? 'reserved'
              : url ? 'random'
              : '';

            // 'invalid' -> null (banned) or 'invalid' string reason
            function urlProblem(u) {
              try {
                const urlObj = new URL(u);
                if (bannedData.hosts.some(h => urlObj.hostname.includes(h)) || bannedData.urls.includes(u)) {
                  return 'banned';
                }
                return '';
              } catch (e) {
                return 'invalid';
              }
            }

            // Determine mode: request (issue opened) / approve / reject
            let mode = '';
            let approver = '';
            if (process.env.EVENT_NAME === 'issues' && process.env.ACTION === 'opened') {
              mode = 'request';
            } else if (process.env.EVENT_NAME === 'issue_comment' && process.env.ACTION === 'created') {
              const c = (process.env.COMMENT_BODY || '').trim().toLowerCase();
              if (!/^approved?$/.test(c)) {
                console.log('Comment is not an approval.');
                return;
              }
              approver = process.env.COMMENT_AUTHOR;
              if (!await isAuthorized(approver)) {
                console.log(`User ${approver} not authorized to approve.`);
                return;
              }
              mode = 'approve';
            } else if (process.env.EVENT_NAME === 'issues' && process.env.ACTION === 'closed') {
              const reason = process.env.STATE_REASON;
              console.log(`Issue closed with state_reason: ${reason}`);
              if ((process.env.SENDER || '').endsWith('[bot]')) {
                console.log('Closed by bot (already processed), skipping.');
                return;
              }
              if (reason === 'not_planned') {
                mode = 'reject';
              } else if (reason === 'completed') {
                mode = 'approve';
                approver = process.env.SENDER;
              } else {
                return;
              }
            } else {
              return;
            }

            if (!type) {
              if (mode === 'request') {
                await comment([
                  '❌ Could not find any valid request fields in the issue body.',
                  '',
                  'Supported formats:',
                  '- Random shortlink: `URL: https://example.com`',
                  '- Reserved slug: `URL: https://example.com` + `SLUG: my-slug`',
                  '- Edit link: `EDIT: my-slug` + `URL: https://new-target.com`',
                  '- Delete link: `DELETE: my-slug`'
                ].join('\n'));
                await closeIssue('not_planned');
              }
              return;
            }

            // For closed-as-completed approvals: verify the closer is authorized.
            // Idempotence guards run first inside each handler (the bot itself closes
            // issues after processing, which re-triggers the closed event).
            async function verifyCloserAuthorized(alreadyDone) {
              if (alreadyDone) return false; // nothing to do, silent
              if (process.env.EVENT_NAME === 'issues' && process.env.ACTION === 'closed') {
                if (!await isAuthorized(approver)) {
                  await comment(`⚠️ Only maintainers can approve by closing as completed. Reopening.`);
                  await reopenIssue();
                  return false;
                }
              }
              return true;
            }

            const findLink = (slug) => linksData.links.find(l => l.slug === slug);

            // ============ RANDOM ============
            if (type === 'random') {
              if (mode !== 'request') return; // random links are only processed on open

              const problem = urlProblem(url);
              if (problem) {
                await comment(problem === 'banned' ? '❌ The URL domain or path is banned.' : '❌ Invalid URL format.');
                await closeIssue('not_planned');
                return;
              }

              // Duplicate destination -> return the existing shortlink instead
              const dup = linksData.links.find(l => !l.reserved && l.url === url);
              if (dup) {
                await comment(`ℹ️ A shortlink for this URL already exists: ${shortUrlOf(dup.slug)} \nTarget: ${dup.url}`);
                await closeIssue();
                return;
              }

              let finalSlug = generateSlug();
              while (linksData.links.some(l => l.slug === finalSlug)) {
                finalSlug = generateSlug();
              }

              linksData.links.unshift({
                slug: finalSlug,
                url,
                reserved: false,
                createdAt: new Date().toISOString(),
                createdBy: process.env.SENDER,
                issueNumber
              });
              writeJson(DATA_FILE, linksData);
              await commitAndPush(`Add shortlink: ${finalSlug}`);

              await comment(`✨ **Created!**\n\nShort link: ${shortUrlOf(finalSlug)} \nTarget: ${url}`);
              await closeIssue();
              return;
            }

            // ============ RESERVED ============
            if (type === 'reserved') {
              const previewUrl = shortUrlOf(requestedSlug);

              async function createReserved(byUser, note) {
                linksData.links.unshift({
                  slug: requestedSlug,
                  url,
                  reserved: true,
                  createdAt: new Date().toISOString(),
                  createdBy: byUser,
                  issueNumber
                });
                writeJson(DATA_FILE, linksData);
                await commitAndPush(`Add shortlink: ${requestedSlug}`);
                await comment(`${note}\n\nShort link created: ${shortUrlOf(requestedSlug)} \nTarget: ${url}`);
                await closeIssue();
              }

              if (mode === 'request') {
                if (!SLUG_RE.test(requestedSlug)) {
                  await comment(`❌ Invalid slug \`${requestedSlug}\`. Allowed characters: letters, numbers, \`-\`, \`_\`.`);
                  await closeIssue('not_planned');
                  return;
                }
                const problem = urlProblem(url);
                if (problem) {
                  await comment(problem === 'banned' ? '❌ The URL domain or path is banned.' : '❌ Invalid or missing URL. Include a line like `URL: https://example.com`.');
                  await closeIssue('not_planned');
                  return;
                }
                const taken = findLink(requestedSlug);
                if (taken) {
                  await comment(`❌ Slug \`${requestedSlug}\` is already in use → ${taken.url}\n\nPick a different slug and open a new issue, or request a change with an \`EDIT:\` / \`DELETE:\` issue.`);
                  await closeIssue('not_planned');
                  return;
                }
                // Maintainer opened it -> auto-approve
                if (await isAuthorized(process.env.ISSUE_AUTHOR)) {
                  await createReserved(process.env.ISSUE_AUTHOR, '⚡ **Auto-approved** (maintainer request)');
                  return;
                }
                await comment([
                  `👋 Reserved slug request detected: [${previewUrl}](${previewUrl})`,
                  '',
                  'To approve this link, a maintainer can:',
                  '- Comment **"Approved"**',
                  '- Or close this issue as **"Close as completed"**',
                  '',
                  'To reject, close as **"Close as not planned"**.'
                ].join('\n'));
                return;
              }

              if (mode === 'approve') {
                const alreadyDone = linksData.links.some(l => l.issueNumber === issueNumber);
                if (!await verifyCloserAuthorized(alreadyDone)) return;
                const problem = urlProblem(url);
                if (problem) {
                  await comment(problem === 'banned' ? '❌ The URL domain or path is banned.' : '❌ Invalid URL format.');
                  await closeIssue('not_planned');
                  return;
                }
                const taken = findLink(requestedSlug);
                if (taken) {
                  await comment(`❌ Slug \`${requestedSlug}\` is already in use → ${taken.url}`);
                  await closeIssue('not_planned');
                  return;
                }
                await createReserved(approver, `✅ **Approved** by @${approver}.`);
                return;
              }

              if (mode === 'reject') {
                if (linksData.links.some(l => l.issueNumber === issueNumber)) return; // already created earlier
                await comment(`❌ **Rejected**\n\nThe reserved slug request for \`${requestedSlug}\` (${previewUrl}) has been rejected.`);
                return;
              }
              return;
            }

            // ============ DELETE ============
            if (type === 'delete') {
              async function performDelete(byUser, note) {
                const link = findLink(deleteSlug);
                linksData.links = linksData.links.filter(l => l.slug !== deleteSlug);
                writeJson(DATA_FILE, linksData);
                await commitAndPush(`Delete shortlink: ${deleteSlug}`);
                await comment(`${note}\n\nDeleted: ${shortUrlOf(deleteSlug)} \nTarget was: ${link.url}`);
                await closeIssue();
              }

              if (mode === 'request') {
                const link = findLink(deleteSlug);
                if (!link) {
                  await comment(`❌ No shortlink found for slug \`${deleteSlug}\`.`);
                  await closeIssue('not_planned');
                  return;
                }
                if (await isAuthorized(process.env.ISSUE_AUTHOR)) {
                  await performDelete(process.env.ISSUE_AUTHOR, '⚡ **Auto-approved** (maintainer request)');
                  return;
                }
                await comment([
                  `🗑️ Delete request detected for \`${deleteSlug}\` (${shortUrlOf(deleteSlug)} → ${link.url})`,
                  '',
                  'To approve this deletion, a maintainer can:',
                  '- Comment **"Approved"**',
                  '- Or close this issue as **"Close as completed"**',
                  '',
                  'To reject, close as **"Close as not planned"**.'
                ].join('\n'));
                return;
              }

              if (mode === 'approve') {
                const link = findLink(deleteSlug);
                const alreadyDone = !link; // already deleted (or never existed)
                if (!await verifyCloserAuthorized(alreadyDone)) return;
                await performDelete(approver, `✅ **Approved** by @${approver}.`);
                return;
              }

              if (mode === 'reject') {
                if (!findLink(deleteSlug)) return; // already deleted earlier
                await comment(`❌ **Rejected**\n\nThe delete request for \`${deleteSlug}\` has been rejected.`);
                return;
              }
              return;
            }

            // ============ EDIT ============
            if (type === 'edit') {
              async function performEdit(byUser, note) {
                const link = findLink(editSlug);
                const oldUrl = link.url;
                link.url = url;
                link.updatedAt = new Date().toISOString();
                link.updatedBy = byUser;
                writeJson(DATA_FILE, linksData);
                await commitAndPush(`Edit shortlink: ${editSlug}`);
                await comment(`${note}\n\nUpdated: ${shortUrlOf(editSlug)} \nOld target: ${oldUrl} \nNew target: ${url}`);
                await closeIssue();
              }

              if (mode === 'request') {
                const link = findLink(editSlug);
                if (!link) {
                  await comment(`❌ No shortlink found for slug \`${editSlug}\`.`);
                  await closeIssue('not_planned');
                  return;
                }
                const problem = urlProblem(url);
                if (problem) {
                  await comment(problem === 'banned' ? '❌ The URL domain or path is banned.' : '❌ Invalid or missing URL. Include a line like `URL: https://new-target.com`.');
                  await closeIssue('not_planned');
                  return;
                }
                if (link.url === url) {
                  await comment(`ℹ️ The shortlink \`${editSlug}\` already points to that URL.`);
                  await closeIssue();
                  return;
                }
                if (await isAuthorized(process.env.ISSUE_AUTHOR)) {
                  await performEdit(process.env.ISSUE_AUTHOR, '⚡ **Auto-approved** (maintainer request)');
                  return;
                }
                await comment([
                  `✏️ Edit request detected for \`${editSlug}\` (${shortUrlOf(editSlug)})`,
                  `- Current target: ${link.url}`,
                  `- New target: ${url}`,
                  '',
                  'To approve this change, a maintainer can:',
                  '- Comment **"Approved"**',
                  '- Or close this issue as **"Close as completed"**',
                  '',
                  'To reject, close as **"Close as not planned"**.'
                ].join('\n'));
                return;
              }

              if (mode === 'approve') {
                const link = findLink(editSlug);
                const alreadyDone = !link || link.url === url; // deleted meanwhile or already applied
                if (!await verifyCloserAuthorized(alreadyDone)) return;
                const problem = urlProblem(url);
                if (problem) {
                  await comment(problem === 'banned' ? '❌ The URL domain or path is banned.' : '❌ Invalid URL format.');
                  await closeIssue('not_planned');
                  return;
                }
                await performEdit(approver, `✅ **Approved** by @${approver}.`);
                return;
              }

              if (mode === 'reject') {
                const link = findLink(editSlug);
                if (!link || link.url === url) return; // already applied or link gone
                await comment(`❌ **Rejected**\n\nThe edit request for \`${editSlug}\` has been rejected.`);
                return;
              }
              return;
            }
